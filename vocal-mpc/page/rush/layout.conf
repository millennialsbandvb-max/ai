# HedRush Harmony touchscreen page (Force Shadow layout syntax, built by tools/build_pages.sh): a floor-processor look,
# black with red. Keys must match params.json (build.sh skin). A knob of radius r takes r+5 above its centre, r+72 below.
theme_bg=a8481c
theme_panel=141414
theme_line=2a2a2a
theme_ink=f2f2f2
theme_ink_dim=8f8f8f
theme_accent=ffe08a
theme_accent_hi=fff0c0
theme_lcd=050505
theme_seg_active=ffe08a
theme_seg_inactive=1a1a1a
theme_seg_active_tx=050505
theme_btn_text=f2f2f2
theme_tab_on=ffe08a
theme_tab_on_tx=050505
theme_knob_face=1f1f1f
theme_knob_ring=333333
theme_knob_dot=fff0c0
# pedal look (tools/pedal_look.css): the enclosure colour
theme_plate_hi=d8661c
theme_plate_lo=5a2208
[tab HARMONY]
frame x=20 y=96 w=400 h=608 title="KEY"
knob cx=120 cy=200 r=36 label="KEY" key=key
knob cx=320 cy=200 r=36 label="SCALE" key=scale
knob cx=120 cy=390 r=36 label="DRY" key=dry
knob cx=320 cy=390 r=36 label="TONE" key=tone
knob cx=120 cy=580 r=36 label="GLIDE" key=glide
knob cx=320 cy=580 r=36 label="OUTPUT" key=output
frame x=428 y=96 w=412 h=608 title="VOICE 1"
knob cx=634 cy=240 r=72 label="INTERVAL" key=v1
knob cx=534 cy=520 r=40 label="LEVEL" key=v1_level
knob cx=734 cy=520 r=40 label="PAN" key=v1_pan
frame x=848 y=96 w=412 h=608 title="VOICE 2"
knob cx=1054 cy=240 r=72 label="INTERVAL" key=v2
knob cx=954 cy=520 r=40 label="LEVEL" key=v2_level
knob cx=1154 cy=520 r=40 label="PAN" key=v2_pan
qlinks "HARMONY" = key,scale,v1,v1_level,v1_pan,v2,v2_level,v2_pan,dry,tone,glide,output
