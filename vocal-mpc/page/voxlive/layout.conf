# VoxLive 3X touchscreen page (Force Shadow layout syntax, built by tools/build_pages.sh). Keys must match params.json
# (written from the plugin's own table: build.sh skin). A knob of radius r takes r+5 above its centre and r+72 below.
theme_bg=4a2a7a
theme_panel=161b22
theme_line=242c38
theme_ink=e8f1ff
theme_ink_dim=8494aa
theme_accent=2ec4ff
theme_accent_hi=7fdcff
theme_lcd=0a0c10
theme_seg_active=2ec4ff
theme_seg_inactive=121820
theme_seg_active_tx=06090c
theme_btn_text=e8f1ff
theme_tab_on=2ec4ff
theme_tab_on_tx=06090c
theme_knob_face=1f2631
theme_knob_ring=2f3a49
theme_knob_dot=2ec4ff
# pedal look (tools/pedal_look.css): the enclosure colour
theme_plate_hi=6a3fa8
theme_plate_lo=23123d
[tab MAIN]
frame x=20 y=96 w=1240 h=150 title="STYLE"
stepper cx=640 cy=190 w=1000 h=64 label="" key=style
frame x=20 y=254 w=820 h=450 title="HARMONY"
enum_h cx=430 cy=336 sw=240 rows=1 label="" key=mode
knob cx=110 cy=490 r=44 label="KEY" key=key
knob cx=270 cy=490 r=44 label="SCALE" key=scale
knob cx=430 cy=490 r=44 label="HARMONY" key=harmony
knob cx=590 cy=490 r=44 label="HUMANIZE" key=humanize
knob cx=750 cy=490 r=44 label="DOUBLE" key=double
frame x=848 y=254 w=412 h=450 title="LEAD"
knob cx=950 cy=350 r=38 label="TUNE" key=tune
knob cx=1160 cy=350 r=38 label="SPEED" key=tune_speed
knob cx=950 cy=550 r=38 label="LEAD" key=lead
knob cx=1160 cy=550 r=38 label="OUTPUT" key=output
qlinks "MAIN" = style,mode,key,scale,harmony,humanize,double,tune,tune_speed,lead,output
