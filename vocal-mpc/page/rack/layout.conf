# Vocal Rack touchscreen page (Force Shadow layout syntax, built by tools/build_pages.sh). Keys must match params.json
# (build.sh skin). A knob of radius r takes r+5 above its centre and r+72 below.
theme_bg=33363c
theme_panel=1b1a20
theme_line=2c2a33
theme_ink=f3effa
theme_ink_dim=958fa3
theme_accent=5fe08a
theme_accent_hi=9af0b6
theme_lcd=0c0b0e
theme_seg_active=5fe08a
theme_seg_inactive=17161b
theme_seg_active_tx=0c0b0e
theme_btn_text=f3effa
theme_tab_on=5fe08a
theme_tab_on_tx=0c0b0e
theme_knob_face=26242c
theme_knob_ring=37343f
theme_knob_dot=9af0b6
# pedal look (tools/pedal_look.css): the enclosure colour
theme_plate_hi=4a4d55
theme_plate_lo=1c1d22
[tab DYNAMICS]
frame x=20 y=96 w=1240 h=150 title="PRESET"
stepper cx=560 cy=180 w=820 h=60 label="" key=preset
knob cx=1150 cy=150 r=22 label="OUTPUT" key=output
frame x=20 y=254 w=300 h=450 title="GATE"
toggle cx=170 cy=330 label="ON" key=gate
knob cx=170 cy=500 r=50 label="THRESHOLD" key=gate_thr
frame x=328 y=254 w=470 h=450 title="COMPRESSOR"
toggle cx=563 cy=330 label="ON" key=comp
knob cx=450 cy=500 r=46 label="THRESHOLD" key=comp_thr
knob cx=680 cy=500 r=46 label="RATIO" key=ratio
frame x=806 y=254 w=454 h=450 title="DE-ESSER"
toggle cx=1033 cy=330 label="ON" key=deess
knob cx=920 cy=500 r=46 label="AMOUNT" key=deess_amt
knob cx=1150 cy=500 r=46 label="FREQ" key=deess_freq
qlinks "DYNAMICS" = preset,gate,gate_thr,comp,comp_thr,ratio,deess,deess_amt,deess_freq,output
[tab TONE & PITCH]
frame x=20 y=96 w=620 h=608 title="EQ"
toggle cx=330 cy=170 label="ON" key=eq
knob cx=175 cy=330 r=50 label="LOW CUT" key=low_cut
knob cx=465 cy=330 r=50 label="BODY" key=body
knob cx=175 cy=560 r=50 label="PRESENCE" key=presence
knob cx=465 cy=560 r=50 label="AIR" key=air
frame x=648 y=96 w=612 h=608 title="TUNE"
toggle cx=954 cy=170 label="ON" key=tune
knob cx=800 cy=330 r=50 label="KEY" key=key
knob cx=1110 cy=330 r=50 label="SCALE" key=scale
knob cx=800 cy=560 r=50 label="AMOUNT" key=tune_amt
knob cx=1110 cy=560 r=50 label="SPEED" key=tune_speed
qlinks "TONE & PITCH" = eq,low_cut,body,presence,air,tune,key,scale,tune_amt,tune_speed
[tab FX & SPACE]
frame x=20 y=96 w=400 h=300 title="FX"
knob cx=120 cy=200 r=44 label="TYPE" key=fx
knob cx=310 cy=200 r=44 label="AMOUNT" key=fx_amt
frame x=20 y=404 w=400 h=300 title="DOUBLE"
toggle cx=120 cy=520 label="ON" key=double
knob cx=310 cy=510 r=44 label="AMOUNT" key=double_amt
frame x=428 y=96 w=832 h=300 title="DELAY"
toggle cx=530 cy=210 label="ON" key=delay
knob cx=710 cy=200 r=44 label="TIME" key=delay_time
knob cx=900 cy=200 r=44 label="FEEDBACK" key=delay_fb
knob cx=1100 cy=200 r=44 label="MIX" key=delay_mix
frame x=428 y=404 w=832 h=300 title="REVERB"
toggle cx=530 cy=520 label="ON" key=reverb
knob cx=710 cy=510 r=44 label="DECAY" key=rev_decay
knob cx=900 cy=510 r=44 label="MIX" key=rev_mix
knob cx=1100 cy=510 r=44 label="TONE" key=rev_tone
qlinks "FX & SPACE" = fx,fx_amt,double,double_amt,delay,delay_time,delay_fb,delay_mix,reverb,rev_decay,rev_mix,rev_tone
