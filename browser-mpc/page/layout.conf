# MPC Browser touchscreen page (Force Shadow layout syntax, built by tools/build_pages.sh). The area below the
# buttons is painted the overlay marker colour by build.sh: the browser shows there (see mpc-remote/overlay.h).
# pedal look (tools/pedal_look.css): the enclosure colour
theme_panel=1a1a1a
theme_line=4a4a4a
theme_ink=f4efe6
theme_ink_dim=cfc6b8
theme_lcd=0b0b0b
theme_seg_inactive=1a1a1a
theme_seg_active_tx=111111
theme_btn_text=f4efe6
theme_tab_on_tx=111111
theme_knob_face=d8d8d4
theme_knob_ring=1a1a1a
theme_bg=39424f
theme_plate_hi=55606f
theme_plate_lo=1c222a
theme_accent=7fc8ff
theme_accent_hi=b0dcff
theme_seg_active=7fc8ff
theme_tab_on=7fc8ff
theme_knob_dot=b0dcff
[tab BROWSER]
button cx=110 cy=118 label="BACK" key=back
button cx=290 cy=118 label="FORWARD" key=forward
button cx=470 cy=118 label="RELOAD" key=reload
button cx=650 cy=118 label="HOME" key=home
button cx=1150 cy=118 label="KEYBOARD" key=keyboard
qlinks "BROWSER" = back,forward,reload,home,keyboard
