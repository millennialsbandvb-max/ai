# MPC Browser touchscreen page (Force Shadow layout syntax, built by tools/build_pages.sh). The area below the
# buttons is painted the overlay marker colour by build.sh: the browser shows there (see mpc-remote/overlay.h).
[tab BROWSER]
button cx=110 cy=118 label="BACK" key=back
button cx=290 cy=118 label="FORWARD" key=forward
button cx=470 cy=118 label="RELOAD" key=reload
button cx=650 cy=118 label="HOME" key=home
qlinks "BROWSER" = back,forward,reload,home
