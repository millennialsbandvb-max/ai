<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>PocketBeat</title>
<style>
  /* Layout: one dark screen, big meter on top, sliders below. Stage-readable from a distance. */
  :root {
    --bg: #0e0f12;
    --panel: #181a20;
    --fg: #f2efe6;
    --muted: #8b8f9c;
    --kick: #ff6a3d;
    --snare: #ffd166;
    --hat: #7bdff2;
    --line: #2a2d36;
    --font-display: "Avenir Next Condensed", "Helvetica Neue", Arial Narrow, sans-serif;
    --font-body: -apple-system, "Helvetica Neue", Arial, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: var(--font-body);
    padding-block: env(safe-area-inset-top, 0px) env(safe-area-inset-bottom, 0px);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex; flex-direction: column; gap: 14px;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  header { display: flex; align-items: baseline; justify-content: space-between; padding-top: 10px; }
  h1 { font-family: var(--font-display); font-weight: 700; font-size: 28px; letter-spacing: .02em; margin: 0; }
  .status { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }

  .meter {
    position: relative; background: var(--panel); border-radius: 18px;
    height: 180px; overflow: hidden; border: 1px solid var(--line);
  }
  .meter canvas { width: 100%; height: 100%; display: block; }
  .meter .flash {
    position: absolute; inset: 0; opacity: 0; pointer-events: none;
    transition: opacity .25s ease-out;
  }
  .meter .flash.on { opacity: .45; transition: none; }
  .meter .label {
    position: absolute; left: 14px; top: 10px; font-size: 12px; color: var(--muted);
    text-transform: uppercase; letter-spacing: .08em;
  }
  .meter .last {
    position: absolute; right: 14px; top: 8px; font-family: var(--font-display);
    font-size: 40px; font-weight: 700; letter-spacing: .04em; line-height: 1;
  }

  .counts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .count { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; }
  .count b { display: block; font-family: var(--font-display); font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .count span { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .count.kick b { color: var(--kick); } .count.snare b { color: var(--snare); } .count.hat b { color: var(--hat); }

  .controls { display: grid; gap: 12px; }
  .ctl { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 10px; }
  .ctl label { font-size: 13px; }
  .ctl output { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .ctl input[type=range] { grid-column: 1 / -1; width: 100%; accent-color: var(--fg); }
  .hint { font-size: 12px; color: var(--muted); line-height: 1.45; }

  .big {
    margin-top: auto; margin-bottom: 10px;
    font-family: var(--font-display); font-size: 24px; font-weight: 700; letter-spacing: .04em;
    background: var(--fg); color: var(--bg); border: 0; border-radius: 16px;
    padding: 18px; width: 100%; cursor: pointer;
  }
  .big.live { background: var(--kick); color: #1a0b05; }
  .big:focus-visible { outline: 3px solid var(--hat); outline-offset: 2px; }
  .row { display: flex; gap: 10px; }
  .row button {
    flex: 1; background: var(--panel); color: var(--fg); border: 1px solid var(--line);
    border-radius: 12px; padding: 12px; font-size: 14px; cursor: pointer;
  }
  .row button:active { background: var(--line); }
  .err { color: var(--snare); font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1>PocketBeat</h1>
  <div class="status" id="status">idle</div>
</header>

<div class="meter">
  <canvas id="scope" width="800" height="360"></canvas>
  <div class="flash" id="flash"></div>
  <div class="label">impact · g</div>
  <div class="last" id="last">—</div>
</div>

<div class="counts">
  <div class="count kick"><b id="nKick">0</b><span>kick</span></div>
  <div class="count snare"><b id="nSnare">0</b><span>snare</span></div>
  <div class="count hat"><b id="nHat">0</b><span>hat</span></div>
</div>

<div class="controls">
  <div class="ctl">
    <label for="thr">Snare threshold (lighter tap)</label><output id="thrOut">0.8 g</output>
    <input type="range" id="thr" min="0.3" max="3" step="0.05" value="0.8">
  </div>
  <div class="ctl">
    <label for="kthr">Kick threshold (hard stomp)</label><output id="kthrOut">1.8 g</output>
    <input type="range" id="kthr" min="0.5" max="6" step="0.05" value="1.8">
  </div>
  <div class="ctl">
    <label for="gap">Minimum gap between hits</label><output id="gapOut">140 ms</output>
    <input type="range" id="gap" min="60" max="400" step="10" value="140">
  </div>
  <div class="ctl">
    <label for="vol">Volume</label><output id="volOut">80%</output>
    <input type="range" id="vol" min="0" max="100" step="1" value="80">
  </div>
  <p class="hint">Stomp hard for a kick, tap lighter for a snare, two quick taps for a hi-hat. Watch the meter, then drag the thresholds until it only fires when you mean it. Keep the screen on; iOS pauses web audio when the screen locks.</p>
  <p class="err" id="err" hidden></p>
  <p class="hint" id="diag"></p>
</div>

<div class="row">
  <button type="button" id="testKick">Test kick</button>
  <button type="button" id="testSnare">Test snare</button>
  <button type="button" id="testHat">Test hat</button>
</div>
<button class="big" id="go" type="button">Start</button>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const statusEl = $('status'), lastEl = $('last'), flash = $('flash'), err = $('err');
  const counts = { kick: 0, snare: 0, hat: 0 };
  const colors = { kick: '#ff6a3d', snare: '#ffd166', hat: '#7bdff2' };

  // ---------- Synth drums (no sample files needed) ----------
  let ctx = null, master = null;
  function ensureAudio() {
    if (ctx) return;
    ctx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
    master = ctx.createGain();
    master.gain.value = $('vol').value / 100;
    master.connect(ctx.destination);
  }
  function noiseBuffer(seconds) {
    const len = Math.floor(ctx.sampleRate * seconds);
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    return buf;
  }
  let noise;
  function kick(vel = 1) {
    const t = ctx.currentTime;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(150, t);
    o.frequency.exponentialRampToValueAtTime(45, t + 0.12);
    g.gain.setValueAtTime(1.2 * vel, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.45);
    o.connect(g).connect(master);
    o.start(t); o.stop(t + 0.5);
    // click transient
    const c = ctx.createBufferSource(); c.buffer = noise;
    const cg = ctx.createGain(); cg.gain.setValueAtTime(0.4 * vel, t);
    cg.gain.exponentialRampToValueAtTime(0.001, t + 0.02);
    c.connect(cg).connect(master); c.start(t); c.stop(t + 0.03);
  }
  function snare(vel = 1) {
    const t = ctx.currentTime;
    const n = ctx.createBufferSource(); n.buffer = noise;
    const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 1500;
    const g = ctx.createGain(); g.gain.setValueAtTime(0.9 * vel, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
    n.connect(f).connect(g).connect(master); n.start(t); n.stop(t + 0.25);
    const o = ctx.createOscillator(), og = ctx.createGain();
    o.type = 'triangle'; o.frequency.setValueAtTime(220, t);
    o.frequency.exponentialRampToValueAtTime(150, t + 0.08);
    og.gain.setValueAtTime(0.6 * vel, t); og.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
    o.connect(og).connect(master); o.start(t); o.stop(t + 0.15);
  }
  function hat(vel = 1) {
    const t = ctx.currentTime;
    const n = ctx.createBufferSource(); n.buffer = noise;
    const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 7000;
    const g = ctx.createGain(); g.gain.setValueAtTime(0.5 * vel, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.06);
    n.connect(f).connect(g).connect(master); n.start(t); n.stop(t + 0.08);
  }
  const play = { kick, snare, hat };

  function hit(kind, vel) {
    play[kind](Math.min(1, 0.5 + vel * 0.5));
    counts[kind]++;
    $('n' + kind[0].toUpperCase() + kind.slice(1)).textContent = counts[kind];
    lastEl.textContent = kind.toUpperCase();
    lastEl.style.color = colors[kind];
    flash.style.background = colors[kind];
    flash.classList.add('on');
    requestAnimationFrame(() => requestAnimationFrame(() => flash.classList.remove('on')));
  }

  // ---------- Motion detection ----------
  // We watch the magnitude of linear acceleration (gravity removed) and fire on a sharp peak.
  let lastHit = 0, lastSnare = 0, armed = true, peak = 0, peakT = 0;
  const trace = new Float32Array(240); let ti = 0;
  let gx = 0, gy = 0, gz = 0;
  const G = 9.81;

  function onMotion(e) {
    let ax, ay, az;
    if (e.acceleration && e.acceleration.x !== null) {
      ({ x: ax, y: ay, z: az } = e.acceleration);
    } else if (e.accelerationIncludingGravity) {
      // Old devices: estimate gravity with a slow low-pass and subtract it.
      const a = e.accelerationIncludingGravity, k = 0.08;
      gx += k * (a.x - gx); gy += k * (a.y - gy); gz += k * (a.z - gz);
      ax = a.x - gx; ay = a.y - gy; az = a.z - gz;
    } else return;
    const mag = Math.sqrt(ax * ax + ay * ay + az * az) / G; // in g
    trace[ti] = mag; ti = (ti + 1) % trace.length;

    const now = performance.now();
    const snareThr = +$('thr').value, kickThr = +$('kthr').value, gap = +$('gap').value;

    // Simple peak detector: track the max while above the snare threshold,
    // then classify once the signal drops back below (or after 40 ms, whichever first).
    if (mag > snareThr) {
      if (armed && now - lastHit > gap) {
        if (mag > peak) { peak = mag; if (!peakT) peakT = now; }
        if (now - peakT > 40) classify(now);
      }
    } else if (peakT) {
      classify(now);
    }
  }
  function classify(now) {
    const kickThr = +$('kthr').value;
    const p = peak; peak = 0; peakT = 0; lastHit = now;
    if (p >= kickThr) { hit('kick', Math.min(1, p / (kickThr * 2))); return; }
    // Two light taps within 260 ms → hi-hat on the second.
    if (now - lastSnare < 260) { hit('hat', 0.8); lastSnare = 0; return; }
    lastSnare = now;
    hit('snare', Math.min(1, p / kickThr));
  }

  // ---------- Scope ----------
  const cv = $('scope'), g2 = cv.getContext('2d');
  function draw() {
    const w = cv.width, h = cv.height;
    g2.clearRect(0, 0, w, h);
    const sThr = +$('thr').value, kThr = +$('kthr').value, scale = Math.max(kThr * 1.4, 2.5);
    const y = v => h - (v / scale) * h;
    g2.strokeStyle = '#2a2d36'; g2.lineWidth = 2;
    for (const [v, c] of [[sThr, colors.snare], [kThr, colors.kick]]) {
      g2.strokeStyle = c; g2.setLineDash([8, 8]);
      g2.beginPath(); g2.moveTo(0, y(v)); g2.lineTo(w, y(v)); g2.stroke();
    }
    g2.setLineDash([]);
    g2.strokeStyle = '#f2efe6'; g2.lineWidth = 3; g2.beginPath();
    for (let i = 0; i < trace.length; i++) {
      const v = trace[(ti + i) % trace.length];
      const x = (i / (trace.length - 1)) * w;
      i ? g2.lineTo(x, y(v)) : g2.moveTo(x, y(v));
    }
    g2.stroke();
    requestAnimationFrame(draw);
  }
  draw();

  // ---------- Controls ----------
  const bind = (id, out, fmt) => { const el = $(id); const f = () => $(out).textContent = fmt(el.value); el.addEventListener('input', f); f(); };
  bind('thr', 'thrOut', v => (+v).toFixed(2) + ' g');
  bind('kthr', 'kthrOut', v => (+v).toFixed(2) + ' g');
  bind('gap', 'gapOut', v => v + ' ms');
  bind('vol', 'volOut', v => v + '%');
  $('vol').addEventListener('input', () => { if (master) master.gain.value = $('vol').value / 100; });
  for (const k of ['kick', 'snare', 'hat']) {
    $('test' + k[0].toUpperCase() + k.slice(1)).addEventListener('click', () => {
      ensureAudio(); if (!noise) noise = noiseBuffer(1); ctx.resume(); hit(k, 1);
    });
  }

  let running = false, wakeLock = null;
  async function start() {
    err.hidden = true;
    if (typeof DeviceMotionEvent === 'undefined') {
      err.textContent = 'This browser has no motion sensor access.'; err.hidden = false; return;
    }
    // iOS 13+ needs an explicit permission prompt. It must be the FIRST thing called inside the
    // tap handler, before any await, or Safari/Chrome drop the request silently.
    let perm = null;
    if (typeof DeviceMotionEvent.requestPermission === 'function') {
      perm = DeviceMotionEvent.requestPermission();
    }
    ensureAudio(); if (!noise) noise = noiseBuffer(1);
    ctx.resume();
    if (perm) {
      try {
        const r = await perm;
        if (r !== 'granted') { err.textContent = 'Motion access was denied (' + r + '). Close this tab completely, reopen the link and tap Allow.'; err.hidden = false; return; }
      } catch (e) {
        err.textContent = 'Motion permission failed: ' + (e && e.message ? e.message : e) + '. Needs https.'; err.hidden = false; return;
      }
    } else {
      statusEl.textContent = 'no prompt needed';
    }
    window.addEventListener('devicemotion', onMotion);
    try { wakeLock = await navigator.wakeLock?.request('screen'); } catch (e) {}
    running = true;
    $('go').textContent = 'Stop'; $('go').classList.add('live');
    statusEl.textContent = 'listening';
    // Older iOS (12.x) also has a Settings › Safari › Motion & Orientation Access toggle.
    setTimeout(() => { if (running && ti === 0) { err.textContent = 'Permission OK but no motion data arriving. On iOS 12, enable Settings › Safari › Motion & Orientation Access, then reload.'; err.hidden = false; } }, 2000);
  }
  function stop() {
    window.removeEventListener('devicemotion', onMotion);
    try { wakeLock?.release(); } catch (e) {}
    running = false;
    $('go').textContent = 'Start'; $('go').classList.remove('live');
    statusEl.textContent = 'idle';
  }
  $('go').addEventListener('click', () => running ? stop() : start());
  // Diagnostics so we can see what this phone supports.
  const hasDM = typeof DeviceMotionEvent !== 'undefined';
  const needsPerm = hasDM && typeof DeviceMotionEvent.requestPermission === 'function';
  $('diag').textContent = 'https: ' + (location.protocol === 'https:') + ' · motion API: ' + hasDM + ' · prompt required: ' + needsPerm + ' · ' + navigator.userAgent.replace(/^.*?(iPhone; CPU iPhone OS [\d_]+|Android [\d.]+).*$/, '$1').replace(/_/g, '.');
  document.addEventListener('visibilitychange', () => { if (!document.hidden && ctx) ctx.resume(); });
})();
</script>
</body>
</html>
