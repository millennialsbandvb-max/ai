# Tri Chorus touchscreen page (Force Shadow layout syntax, built by tools/build_pages.sh). Keys must match params.json
# (written from the plugin's own table: build.sh skin). A knob of radius r takes r+5 above its centre and r+72 below.
theme_bg=4d6f99
theme_panel=181d26
theme_line=262d3a
theme_ink=eef0ff
theme_ink_dim=8a90a8
theme_accent=e6eeff
theme_accent_hi=ffffff
theme_lcd=0b0d12
theme_seg_active=e6eeff
theme_seg_inactive=141820
theme_seg_active_tx=0b0d12
theme_btn_text=eef0ff
theme_tab_on=e6eeff
theme_tab_on_tx=0b0d12
theme_knob_face=262b38
theme_knob_ring=343b4c
theme_knob_dot=ffffff
# pedal look (tools/pedal_look.css): the enclosure colour
theme_plate_hi=7091bd
theme_plate_lo=2a4060
[tab TRI CHORUS]
frame x=20 y=96 w=1240 h=330 title="CHORUS"
knob cx=230 cy=230 r=70 label="RATE" key=rate
knob cx=640 cy=230 r=70 label="DEPTH" key=depth
knob cx=1050 cy=230 r=70 label="MIX" key=mix
frame x=20 y=434 w=820 h=270 title="VOICES"
knob cx=110 cy=532 r=38 label="ENSEMBLE" key=ensemble
knob cx=280 cy=532 r=38 label="WIDTH" key=width
knob cx=450 cy=532 r=38 label="TONE" key=tone
knob cx=620 cy=532 r=38 label="DELAY" key=delay
enum_v cx=765 cy=572 label="MODE" key=mode
frame x=848 y=434 w=412 h=270 title="SHIMMER"
knob cx=940 cy=532 r=38 label="SHIMMER" key=shimmer
enum_h cx=1150 cy=560 sw=96 rows=3 label="" key=shim_pitch
qlinks "TRI CHORUS" = rate,depth,mix,ensemble,width,tone,delay,shimmer,shim_pitch,mode,output
