# Enz0 X touchscreen page (Force Shadow layout syntax, built by tools/build_pages.sh). Keys must match params.json
# (build.sh skin: the plugin's own table). A knob of radius r takes r+5 above its centre and r+72 below; a frame title
# needs 50 px. No apostrophes in comments (shlex).
# Pedal look (tools/pedal_look.css): a deep purple enclosure with cyan accents.
theme_bg=241a3a
theme_plate_hi=45307a
theme_plate_lo=1a1030
theme_panel=170f2a
theme_line=4a3a78
theme_ink=f0ecff
theme_ink_dim=c3b8e8
theme_accent=3fd6e0
theme_accent_hi=8af0f6
theme_lcd=0c0818
theme_seg_active=3fd6e0
theme_seg_inactive=1c1236
theme_seg_active_tx=0c0818
theme_btn_text=f0ecff
theme_tab_on=3fd6e0
theme_tab_on_tx=0c0818
theme_knob_face=d8d8d4
theme_knob_ring=170f2a
theme_knob_dot=6ff0f8
[tab SYNTH]
frame x=20 y=96 w=1240 h=130 title="PROGRAM"
stepper cx=480 cy=172 w=880 h=56 label="" key=program
stepper cx=1110 cy=172 w=260 h=46 label="" key=midi_ch   # MIDI Ch (Program Change, CC 64 Hold): Omni / 1..16
frame x=20 y=234 w=1240 h=470 title="SYNTH"
enum_h cx=330 cy=310 sw=140 rows=1 label="" key=mode
toggle cx=900 cy=300 label="HOLD" key=hold
knob cx=130 cy=440 r=46 label="PITCH" key=pitch
knob cx=330 cy=440 r=46 label="WAVE" key=wave
knob cx=530 cy=440 r=46 label="SUB" key=sub
knob cx=730 cy=440 r=46 label="GLIDE" key=glide
knob cx=930 cy=440 r=46 label="SUSTAIN" key=sustain
knob cx=1140 cy=440 r=46 label="MIX" key=mix
knob cx=1140 cy=600 r=34 label="LEVEL" key=level
qlinks "SYNTH" = pitch,wave,sub,glide,sustain,mix,level,program,mode,hold
[tab FILTER]
frame x=20 y=96 w=1240 h=300 title="FILTER"
enum_h cx=330 cy=172 sw=140 rows=1 label="" key=ftype
knob cx=200 cy=300 r=44 label="CUTOFF" key=cutoff
knob cx=450 cy=300 r=44 label="RESONANCE" key=reso
knob cx=700 cy=300 r=44 label="ENV AMOUNT" key=env_amt
frame x=20 y=404 w=1240 h=300 title="ENVELOPE"
enum_h cx=250 cy=480 sw=150 rows=1 label="" key=env_type
knob cx=650 cy=560 r=44 label="ATTACK" key=env_atk
knob cx=900 cy=560 r=44 label="DECAY" key=env_dec
qlinks "FILTER" = cutoff,reso,env_amt,env_atk,env_dec,ftype,env_type
[tab FX]
frame x=20 y=96 w=820 h=300 title="MODULATION"
enum_h cx=330 cy=172 sw=140 rows=1 label="" key=mod_type
knob cx=200 cy=300 r=40 label="DEPTH" key=mod_depth
knob cx=430 cy=300 r=40 label="RATE" key=mod_rate
frame x=850 y=96 w=410 h=300 title="ARP"
enum_v cx=950 cy=260 label="" key=arp
knob cx=1160 cy=260 r=40 label="RATE" key=arp_rate
frame x=20 y=404 w=1240 h=300 title="DELAY / REVERB"
knob cx=170 cy=510 r=42 label="TIME" key=dly_time
knob cx=420 cy=510 r=42 label="FEEDBACK" key=dly_fb
knob cx=670 cy=510 r=42 label="DELAY LEVEL" key=dly_lvl
knob cx=1000 cy=510 r=42 label="REVERB" key=reverb
qlinks "FX" = mod_depth,mod_rate,arp_rate,dly_time,dly_fb,dly_lvl,reverb,mod_type,arp
