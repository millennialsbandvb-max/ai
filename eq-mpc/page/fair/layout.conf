# Fairchyld 670 touchscreen page (Force Shadow layout syntax, built by tools/build_pages.sh), laid out like a console's
# "fair" compressor: the gain-reduction VU on top (vu_face.png from tools/vu_meter.py, the needle a `vu=1` narrow
# slider on the read-only GR parameter: tools/page_lists.py), one row of big knobs under it.
# Keys must match params.json (build.sh skin). A knob of radius r takes r+5 above its centre and r+72 below.
theme_bg=6e757c
theme_panel=4a5056
theme_line=8a9198
theme_ink=f3f1ea
theme_ink_dim=d5d2c8
theme_accent=e8c66a
theme_accent_hi=f5dc95
theme_lcd=1c1c1a
theme_seg_active=e8c66a
theme_seg_inactive=3c4146
theme_seg_active_tx=1c1c1a
theme_btn_text=f3f1ea
theme_tab_on=e8c66a
theme_tab_on_tx=1c1c1a
theme_knob_face=d8d8d4
theme_knob_ring=2e3236
theme_knob_dot=f5dc95
# pedal look (tools/pedal_look.css): the grey hammertone face
theme_plate_hi=8e959c
theme_plate_lo=4f565d
[tab FAIRCHYLD]
frame x=20 y=96 w=1240 h=290 title="FAIRCHYLD 670"
toggle cx=200 cy=240 label="COMP" key=comp
art file=vu_face.png x=420 y=124 w=440 h=230
slider_v cx=640 cy=239 w=440 h=230 narrow=1 vu=1 label="" key=gr
enum_v cx=1110 cy=250 label="MODE" key=mode
frame x=20 y=394 w=1240 h=310 title=""
knob cx=150 cy=490 r=56 label="INPUT" key=input
knob cx=360 cy=490 r=56 label="THRESHOLD" key=threshold
knob cx=570 cy=490 r=56 label="TIME" key=time
knob cx=780 cy=490 r=56 label="BIAS" key=bias
knob cx=990 cy=490 r=56 label="OUTPUT" key=output
knob cx=1170 cy=490 r=40 label="MIX" key=mix
qlinks "FAIRCHYLD" = input,threshold,time,bias,output,mix,mode,comp
