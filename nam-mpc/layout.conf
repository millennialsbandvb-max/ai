# NAM MPC touchscreen page (Force Shadow layout syntax, built by mpc-vst-plugins' tools/shadow_skin.py).
# Keys must match params.json, whose order is the plugin's parameter index.
# Text is drawn 1.35x the generator's default (skin/text_scale.py), so everything is spaced for the larger text:
# a knob of radius r takes r+5 above its centre and r+72 below (name + value); a frame title needs 50 px.
# pedal look (tools/pedal_look.css): the enclosure colour
theme_panel=1a1a1a
theme_line=4a4a4a
theme_ink=f4efe6
theme_ink_dim=cfc6b8
theme_lcd=0b0b0b
theme_seg_inactive=1a1a1a
theme_seg_active_tx=111111
theme_btn_text=f4efe6
theme_tab_on_tx=111111
theme_knob_face=d8d8d4
theme_knob_ring=1a1a1a
theme_bg=1c1c1c
theme_plate_hi=333333
theme_plate_lo=0a0a0a
theme_accent=d4a64a
theme_accent_hi=f0c870
theme_seg_active=d4a64a
theme_tab_on=d4a64a
theme_knob_dot=f0c870
[tab AMP]
frame x=20 y=96 w=1240 h=210 title="MODEL"
stepper cx=470 cy=176 w=840 h=56 label="" key=folder
stepper cx=470 cy=252 w=840 h=56 label="" key=model
toggle cx=1000 cy=196 label="NORMALIZE" key=normalize
knob cx=1165 cy=190 r=36 label="SIZE" key=size
frame x=20 y=316 w=1240 h=222 title="AMP"
knob cx=125 cy=414 r=42 label="INPUT" key=input
knob cx=327 cy=414 r=42 label="GATE" key=gate
knob cx=529 cy=414 r=42 label="BASS" key=bass
knob cx=731 cy=414 r=42 label="MIDDLE" key=middle
knob cx=933 cy=414 r=42 label="TREBLE" key=treble
knob cx=1135 cy=414 r=42 label="OUTPUT" key=output
frame x=20 y=548 w=1240 h=156 title="CAB IR"
toggle cx=120 cy=630 label="CAB" key=cab
stepper cx=440 cy=640 w=420 h=56 label="" key=ir_folder
stepper cx=930 cy=640 w=540 h=56 label="" key=ir
qlinks "AMP" = input,gate,bass,middle,treble,output,folder,model,size,ir_folder,ir,cab,normalize
