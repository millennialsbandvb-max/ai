# Ergo EUB touchscreen page (Force Shadow layout syntax, built by tools/build_pages.sh). Keys must match params.json
# (build.sh skin: the plugin's own table, then NAM MPC's entries as amp_*). A knob of radius r takes r+5 above its
# centre and r+72 below (name + value); a frame title needs 50 px. No apostrophes in comments (shlex).
# Pedal look (tools/pedal_look.css): a warm brown enclosure, like an upright bass, with amber accents.
theme_bg=3a2416
theme_plate_hi=6b4429
theme_plate_lo=2a170c
theme_panel=24150b
theme_line=6a4a32
theme_ink=f6ecdf
theme_ink_dim=d6c2aa
theme_accent=f0a63a
theme_accent_hi=ffc874
theme_lcd=140b05
theme_seg_active=f0a63a
theme_seg_inactive=22140a
theme_seg_active_tx=1a0e05
theme_btn_text=f6ecdf
theme_tab_on=f0a63a
theme_tab_on_tx=1a0e05
theme_knob_face=d8d8d4
theme_knob_ring=24150b
theme_knob_dot=ffb84a
[tab MAIN]
frame x=20 y=96 w=1240 h=130 title="PROGRAM"
stepper cx=480 cy=172 w=880 h=56 label="" key=program
stepper cx=1110 cy=172 w=260 h=46 label="" key=midi_ch   # MIDI Ch for the expression pedal (CC 7 / 11): Omni / 1..16
frame x=20 y=234 w=1240 h=236 title="INPUT / COMPRESSOR"
knob cx=110 cy=335 r=40 label="INPUT" key=input
toggle cx=270 cy=315 label="COMP" key=comp
enum_h cx=270 cy=412 sw=110 rows=2 label="" key=comp_pos
knob cx=430 cy=335 r=40 label="THRESHOLD" key=threshold
knob cx=570 cy=335 r=40 label="RATIO" key=ratio
knob cx=710 cy=335 r=40 label="ATTACK" key=attack
knob cx=850 cy=335 r=40 label="RELEASE" key=release
