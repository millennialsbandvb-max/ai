frame x=20 y=478 w=1240 h=226 title="CHAIN / OUTPUT"
toggle cx=110 cy=580 label="EQ" key=eq
toggle cx=250 cy=580 label="AMP" key=amp
toggle cx=390 cy=580 label="HALL 1" key=r1_on
toggle cx=530 cy=580 label="HALL 2" key=r2_on
knob cx=800 cy=585 r=40 label="RIG VOLUME" key=rig_volume
knob cx=1050 cy=585 r=46 label="VOLUME" key=volume
qlinks "MAIN" = volume,input,threshold,ratio,attack,release,makeup,rig_volume,program,comp,comp_pos,eq,amp,r1_on,r2_on
