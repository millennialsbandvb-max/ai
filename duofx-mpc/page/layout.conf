# Duo FX touchscreen page (Force Shadow layout syntax, built by tools/build_pages.sh).
# Keys must match params.json, whose order is the plugin's parameter index. PROGRAM: both slots at a glance;
# A and B: every knob of one slot. A knob of radius r takes r+5 above its centre and r+72 below; a frame title 50 px.
[tab PROGRAM]
frame x=20 y=96 w=1240 h=204 title="SLOT A"
enum_h cx=520 cy=220 sw=150 rows=2 label="" key=a_algo
knob cx=1120 cy=188 r=34 label="MIX" key=a_mix
frame x=20 y=306 w=1240 h=204 title="SLOT B"
enum_h cx=520 cy=430 sw=150 rows=2 label="" key=b_algo
knob cx=1120 cy=398 r=34 label="MIX" key=b_mix
frame x=20 y=516 w=1240 h=188 title="ROUTING"
enum_h cx=330 cy=616 sw=220 rows=1 label="" key=routing
knob cx=1120 cy=601 r=30 label="OUTPUT" key=output
qlinks "PROGRAM" = a_algo,a_mix,b_algo,b_mix,routing,output
[tab A]
