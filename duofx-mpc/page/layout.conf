# Duo FX touchscreen page (Force Shadow layout syntax, built by tools/build_pages.sh), styled after Eventide's Control
# app: dark cards, light-blue accents, dark knobs.
# Each slot's Preset stepper loads our versions of the H90's factory presets (src/presets.h); the Program stepper
# loads the H90 factory programs read from a backup (both slots + routing).
# Keys must match params.json (written by the plugin's own table: build.sh skin). A knob's name under it is the
# plugin's parameter name, which follows the slot's algorithm ("Time", "Sag", "Key", ...).
# A knob of radius r takes r+5 above its centre and r+72 below (name + value); a frame title takes 50 px.
theme_bg=1e3a63
theme_panel=1f1f23
theme_line=2e2e34
theme_ink=ececec
theme_ink_dim=8c8c94
theme_accent=5ac8fa
theme_accent_hi=8adcff
theme_lcd=0e0e10
theme_seg_active=5ac8fa
theme_seg_inactive=1a1a1e
theme_seg_active_tx=0b0b0c
theme_btn_text=ececec
theme_tab_on=5ac8fa
theme_tab_on_tx=0b0b0c
theme_knob_face=2a2a2f
theme_knob_ring=3a3a40
theme_knob_dot=5ac8fa
# pedal look (tools/pedal_look.css): the enclosure colour
theme_plate_hi=2b5592
theme_plate_lo=0f1f3a
[tab PROGRAM]
frame x=20 y=96 w=616 h=420 title="A"
popup cx=190 cy=184 w=300 h=60 label="" key=a_algo cols=4
knob cx=540 cy=200 r=40 label="MIX" key=a_mix
