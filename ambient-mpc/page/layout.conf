# Ambient Lab touchscreen page (Force Shadow layout syntax, built by tools/build_pages.sh). Keys must match params.json
# (written from the plugin's own table: build.sh skin). Knob names under the knobs are the plugin's parameter names,
# which follow the machine. A knob of radius r takes r+5 above its centre and r+72 below.
theme_bg=1b5c5c
theme_panel=161424
theme_line=262338
theme_ink=efeaff
theme_ink_dim=8d86a8
theme_accent=ffd27a
theme_accent_hi=ffe4a8
theme_lcd=09080f
theme_seg_active=ffd27a
theme_seg_inactive=141220
theme_seg_active_tx=09080f
theme_btn_text=efeaff
theme_tab_on=ffd27a
theme_tab_on_tx=09080f
theme_knob_face=211e33
theme_knob_ring=322e4a
theme_knob_dot=ffe4a8
# pedal look (tools/pedal_look.css): the enclosure colour
theme_plate_hi=2a8a8a
theme_plate_lo=0c3536
[tab AMBIENT LAB]
frame x=20 y=96 w=1240 h=150 title="MACHINE"
popup cx=196 cy=192 w=300 h=64 label="" key=machine cols=2
stepper cx=720 cy=192 w=640 h=64 label="" key=preset
toggle cx=1160 cy=182 label="HOLD" key=hold
frame x=20 y=254 w=1240 h=450 title="PARAMETERS"
knob cx=130 cy=360 r=48 label="1" key=k1
knob cx=370 cy=360 r=48 label="2" key=k2
knob cx=610 cy=360 r=48 label="3" key=k3
knob cx=850 cy=360 r=48 label="4" key=k4
knob cx=130 cy=580 r=48 label="5" key=k5
knob cx=370 cy=580 r=48 label="6" key=k6
knob cx=610 cy=580 r=48 label="7" key=k7
knob cx=850 cy=580 r=48 label="8" key=k8
knob cx=1110 cy=400 r=56 label="MIX" key=mix
knob cx=1110 cy=600 r=30 label="OUTPUT" key=output
qlinks "AMBIENT LAB" = k1,k2,k3,k4,k5,k6,k7,k8,mix,machine,preset,hold,output
