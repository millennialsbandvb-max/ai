# Quad Rig touchscreen page (Force Shadow layout syntax, built by tools/build_pages.sh). Keys must match params.json
# (build.sh skin: ours, the effect names from the engines, and NAM MPC's entries as amp_*). Knob names under the
# FX knobs are the slot's engine's names for them. A knob of radius r takes r+5 above its centre and r+72 below.
# Pedal look (tools/pedal_look.css): a red enclosure (theme_plate_hi/lo) with amber accents.
