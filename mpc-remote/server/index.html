<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>MPC Remote</title>
<style>
  :root { --bg: #111; --fg: #ddd; --dim: #888; --accent: #e5742b; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
               font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  body { display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 12px; padding: 6px 12px; flex: none; }
  header b { color: var(--accent); letter-spacing: .04em; }
  #status { color: var(--dim); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  button { background: #222; color: var(--fg); border: 1px solid #444; border-radius: 6px; padding: 6px 12px;
           font: inherit; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  main { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; padding: 0 8px 8px; }
  canvas { max-width: 100%; max-height: 100%; background: #000; touch-action: none; cursor: crosshair;
           border-radius: 4px; box-shadow: 0 0 0 1px #333; }
  #cal, #lrn { position: fixed; inset: 0; background: rgba(0,0,0,.82); display: none; align-items: center;
         justify-content: center; text-align: center; padding: 24px; }
  #cal.on, #lrn.on { display: flex; }
  #cal div, #lrn div { max-width: 520px; }
  #cal h2, #lrn h2 { color: var(--accent); margin: 0 0 12px; }
  #cal p { font-size: 17px; }
  #pad { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; padding: 0 8px 10px; flex: none; }
  #pad .grp { display: flex; gap: 8px; }
  #pad button { min-width: 74px; padding: 12px 10px; font-weight: 600; letter-spacing: .03em; touch-action: none;
                user-select: none; -webkit-user-select: none; }
  #pad button.on { background: var(--accent); color: #111; }
  #pad button.unset { opacity: .45; }
  #pad button.rec { color: #f55; }
  #pad button.rec.on { color: #111; }
  @media (max-width: 640px) {
    #pad .grp { width: 100%; gap: 6px; }
    #pad button { flex: 1; min-width: 0; padding: 12px 2px; font-size: 12px; }
  }
  #typebox { width: 170px; background: #1a1a1a; color: var(--fg); border: 1px solid #444; border-radius: 6px;
             padding: 6px 8px; font: inherit; }
  #typebox:focus { outline: none; border-color: var(--accent); }
  #typebox[hidden] { display: none; }
  @media (max-width: 640px) { header { flex-wrap: wrap; } #typebox { order: 9; width: 100%; } }
  #lrn .small { margin-top: 18px; font-size: 13px; color: var(--dim); }
</style>
</head>
<body>
<header>
  <b>MPC REMOTE</b>
  <span id="status">connecting…</span>
  <a href="/log" target="_blank" style="color:var(--dim)">log</a>
  <input id="typebox" type="text" placeholder="type to the MPC" autocomplete="off" autocorrect="off"
         autocapitalize="off" spellcheck="false" enterkeyhint="done">
  <button id="keysbtn" type="button"></button>
  <button id="lrnbtn" type="button">Learn buttons</button>
  <button id="calbtn" type="button">Calibrate touch</button>
</header>
<main><canvas id="screen" width="1280" height="800"></canvas></main>
<div id="pad">
  <div class="grp">
    <button type="button" data-b="menu">MENU</button><button type="button" data-b="shift+menu">BROWSE</button>
    <button type="button" data-b="main">MAIN</button>
    <button type="button" data-b="mix">MIX</button><button type="button" data-b="mute">MUTE</button>
  </div>
  <div class="grp">
    <button type="button" data-b="undo">UNDO</button><button type="button" data-b="shift+undo">REDO</button>
    <button type="button" data-b="shift">SHIFT</button>
  </div>
  <div class="grp">
    <button type="button" data-b="rec" class="rec">REC</button><button type="button" data-b="overdub" class="rec">OVERDUB</button>
    <button type="button" data-b="stop">STOP</button><button type="button" data-b="play">PLAY</button>
    <button type="button" data-b="playstart">PLAY START</button>
  </div>
</div>
<div id="cal"><div>
  <h2>Touch calibration</h2>
  <p id="caltext"></p>
  <button id="calcancel" type="button">Cancel</button>
</div></div>
<div id="lrn"><div>
  <h2>Learn buttons</h2>
  <p id="lrntext"></p>
  <button id="lrnskip" type="button">Skip</button> <button id="lrncancel" type="button">Done</button>
  <p class="small">If the MPC's own buttons or pads ever act up with this firmware, switch the button input off here
    and restart the MPC: <button id="lrnoff" type="button">Button input off</button></p>
</div></div>
<script>
"use strict";
const view = document.getElementById("screen"), vctx = view.getContext("2d");
const statusEl = document.getElementById("status");
const calEl = document.getElementById("cal"), calText = document.getElementById("caltext");
let W = 0, H = 0, T = 32, ws = null, frame = null, fctx = null, dirty = false, calibrated = false;
let tiles = 0, bytes = 0, lastStat = performance.now(), queue = Promise.resolve();

const CAL_STEPS = {
  1: "On the MPC itself, tap the <b>top-left</b> corner of the screen.",
  2: "Now tap the <b>top-right</b> corner.",
  3: "Now tap the <b>bottom-left</b> corner.",
};

function setStatus(s) { statusEl.textContent = s; }

function connect() {
  ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws");
  ws.binaryType = "arraybuffer";
  ws.onopen = () => setStatus("connected");
  ws.onclose = () => { setStatus("disconnected – retrying…"); setTimeout(connect, 1500); };
  ws.onmessage = (e) => {   // handled strictly in order (decompressing is asynchronous)
    const d = e.data;
    queue = queue.then(async () => {
      if (typeof d === "string") return onText(JSON.parse(d));
      const fmt = new Uint8Array(d, 0, 1)[0];
      if (fmt === 0) return onTiles(d.slice(1));
      const s = new Blob([new Uint8Array(d, 1)]).stream().pipeThrough(new DecompressionStream("deflate"));
      onTiles(await new Response(s).arrayBuffer());
    }).catch((err) => setStatus("display error: " + err));
  };
}

function onText(m) {
  if (m.type === "wait") { setStatus("no picture yet: " + (m.why || "waiting for the MPC") + " (details: /log)"); return; }
  if (m.type === "hello") {
    W = m.w; H = m.h; T = m.tile; calibrated = m.calibrated;
    frame = document.createElement("canvas");   // the picture as the panel scans it (portrait)
    frame.width = W; frame.height = H;
    fctx = frame.getContext("2d");
    view.width = H; view.height = W;             // shown upright (landscape)
    setStatus(calibrated ? "connected" : "connected – touch not calibrated yet (tap “Calibrate touch”)");
    learned = new Set(m.learned || []); buttonsOn = m.buttons !== false; showPad();
  } else if (m.type === "learn") {
    if (m.name) { lrnText.innerHTML = "On the MPC, press and release <b>" + LABEL[m.name] + "</b>."; return; }
    if (m.done) { learned.add(m.done); showPad(); return learnNext(); }
    if (m.error) { lrnEl.classList.remove("on"); learning = -1; setStatus("learn buttons: " + m.error); }
  } else if (m.type === "btn") {
    if (m.error) setStatus(m.error);
  } else if (m.type === "cal") {
    if (m.step) { calEl.classList.add("on"); calText.innerHTML = CAL_STEPS[m.step]; }
    else {
      calEl.classList.remove("on");
      if (m.done) { calibrated = true; setStatus("touch calibrated"); }
      else if (m.error) setStatus("calibration: " + m.error);
      else if (m.cancelled) setStatus("calibration cancelled");
    }
  }
}

function onTiles(buf) {
  const dv = new DataView(buf);
  const n = dv.getUint32(0, true);
  let p = 4;
  for (let i = 0; i < n; i++) {
    const tx = dv.getUint16(p, true), ty = dv.getUint16(p + 2, true), mode = dv.getUint8(p + 4);
    const len = dv.getUint32(p + 8, true);
    p += 12;
    const x0 = tx * T, y0 = ty * T, w = Math.min(T, W - x0), h = Math.min(T, H - y0);
    const img = fctx.createImageData(w, h), px = img.data;
    let o = 0;
    const put = (c) => {
      px[o] = ((c >> 11) & 31) * 255 / 31; px[o + 1] = ((c >> 5) & 63) * 255 / 63;
      px[o + 2] = (c & 31) * 255 / 31; px[o + 3] = 255; o += 4;
    };
    if (mode === 0) for (let k = 0; k < len; k += 2) put(dv.getUint16(p + k, true));
    else for (let k = 0; k < len; k += 4) {
      const run = dv.getUint16(p + k, true), c = dv.getUint16(p + k + 2, true);
      for (let r = 0; r < run; r++) put(c);
    }
    fctx.putImageData(img, x0, y0);
    p += len;
  }
  tiles += n; bytes += buf.byteLength;
  if (!dirty) { dirty = true; requestAnimationFrame(draw); }
}

function draw() {   // rotate the portrait picture a quarter turn clockwise
  dirty = false;
  vctx.setTransform(0, 1, -1, 0, H, 0);
  vctx.drawImage(frame, 0, 0);
  vctx.setTransform(1, 0, 0, 1, 0, 0);
  const now = performance.now();
  if (now - lastStat > 2000) {
    if (calibrated && statusEl.textContent.startsWith("connected"))
      setStatus("connected · " + Math.round(bytes / 1024 / ((now - lastStat) / 1000)) + " KB/s");
    tiles = 0; bytes = 0; lastStat = now;
  }
}

// pointer -> portrait screen pixels (undoing the rotation)
function toScreen(e) {
  const r = view.getBoundingClientRect();
  const sx = (e.clientX - r.left) * view.width / r.width, sy = (e.clientY - r.top) * view.height / r.height;
  const px = Math.round(sy), py = Math.round(H - 1 - sx);
  return [Math.max(0, Math.min(W - 1, px)), Math.max(0, Math.min(H - 1, py))];
}
function send(s) { if (ws && ws.readyState === 1) ws.send(s); }
let down = false, lastMove = 0;
view.addEventListener("pointerdown", (e) => {
  if (!e.isPrimary || !W) return;
  view.setPointerCapture(e.pointerId);
  down = true;
  const [x, y] = toScreen(e); send(`d ${x} ${y}`);
  e.preventDefault();
});
view.addEventListener("pointermove", (e) => {
  if (!down || !e.isPrimary) return;
  const now = performance.now();
  if (now - lastMove < 16) return;   // ~60 moves a second is plenty
  lastMove = now;
  const [x, y] = toScreen(e); send(`m ${x} ${y}`);
});
const up = (e) => { if (!down || !e.isPrimary) return; down = false; send("u"); };
view.addEventListener("pointerup", up);
view.addEventListener("pointercancel", up);
view.addEventListener("contextmenu", (e) => e.preventDefault());

// MPC's buttons: held while the on-screen button is held
const LABEL = {menu: "MENU", shift: "SHIFT", undo: "UNDO", main: "MAIN", mix: "MIX", mute: "MUTE", rec: "REC", overdub: "OVERDUB", stop: "STOP",
               play: "PLAY", playstart: "PLAY START"};
const ORDER = Object.keys(LABEL);
const lrnEl = document.getElementById("lrn"), lrnText = document.getElementById("lrntext");
let learned = new Set(), buttonsOn = true, learning = -1;
function showPad() {
  for (const b of document.querySelectorAll("#pad button"))
    b.classList.toggle("unset", !b.dataset.b.split("+").every((n) => learned.has(n)));
  document.getElementById("lrnoff").textContent = buttonsOn ? "Button input off" : "Button input on";
}
for (const b of document.querySelectorAll("#pad button")) {
  let held = false;
  b.addEventListener("pointerdown", (e) => {
    b.setPointerCapture(e.pointerId); held = true; b.classList.add("on"); e.preventDefault();
    for (const n of b.dataset.b.split("+")) send("bd " + n);   // a combination (SHIFT+MENU): held in order
  });
  const rel = () => {
    if (!held) return;
    held = false; b.classList.remove("on");
    for (const n of b.dataset.b.split("+").reverse()) send("bu " + n);   // released in reverse
  };
  b.addEventListener("pointerup", rel);
  b.addEventListener("pointercancel", rel);
  b.addEventListener("contextmenu", (e) => e.preventDefault());
}
let todo = ORDER;   // the buttons this round of learning asks for
function learnNext() {
  if (++learning >= todo.length) { lrnEl.classList.remove("on"); learning = -1; setStatus("buttons learned"); return; }
  send("learn " + todo[learning]);
}
document.getElementById("lrnbtn").onclick = () => {
  todo = ORDER.filter((n) => !learned.has(n));   // new ones only; everything again once all are learned
  if (!todo.length) todo = ORDER;
  learning = -1; lrnText.textContent = "…"; lrnEl.classList.add("on"); learnNext(); };
document.getElementById("lrnskip").onclick = () => { send("learncancel"); learnNext(); };
document.getElementById("lrncancel").onclick = () => { send("learncancel"); learning = -1; lrnEl.classList.remove("on"); };
document.getElementById("lrnoff").onclick = () => {
  buttonsOn = !buttonsOn; send(buttonsOn ? "buttons on" : "buttons off"); showPad();
  setStatus("button input " + (buttonsOn ? "on" : "off") + " from the next MPC restart");
};

// ---- the keyboard. Typing: what's typed goes to the MPC as key presses on a (virtual) USB keyboard, for naming
// things; it works from a computer keyboard anywhere on the page, or from a phone's keyboard in the box.
// Shortcuts: computer keys press MPC buttons. Off: the page ignores the keyboard.
const KEYS = {};   // character -> [Linux key code, with shift]
for (const [plain, shifted, first] of [["1234567890-=", "!@#$%^&*()_+", 2], ["qwertyuiop[]", "QWERTYUIOP{}", 16],
                                      ["asdfghjkl;'`", "ASDFGHJKL:\"~", 30], ["\\", "|", 43],
                                      ["zxcvbnm,./", "ZXCVBNM<>?", 44], [" ", " ", 57]])
  for (let i = 0; i < plain.length; i++) { KEYS[plain[i]] = [first + i, false]; KEYS[shifted[i]] ??= [first + i, true]; }
const SPECIAL = {Enter: 28, Backspace: 14, Tab: 15, Escape: 1, Delete: 111, Home: 102, End: 107,
                 ArrowUp: 103, ArrowLeft: 105, ArrowRight: 106, ArrowDown: 108};
const SHIFT = 42;
function tap(code, shift = false) {
  if (shift) send("kd " + SHIFT);
  send("kd " + code); send("ku " + code);
  if (shift) send("ku " + SHIFT);
}
function typeText(t) { for (const ch of t) { const k = KEYS[ch]; if (k) tap(k[0], k[1]); } }

// shortcuts: key -> MPC button (combinations as on the button bar); Space starts and stops
const SHORTCUTS = {r: "rec", o: "overdub", m: "menu", b: "shift+menu", h: "main", x: "mix", u: "mute",
                   z: "undo", Z: "shift+undo", Enter: "playstart"};
let playing = false;
function pressBtn(name, down) {
  const parts = name.split("+");
  for (const n of down ? parts : parts.reverse()) send((down ? "bd " : "bu ") + n);
}

const MODES = ["typing", "shortcuts", "off"];
let keyMode = "typing";
try { keyMode = MODES.includes(localStorage.keyMode) ? localStorage.keyMode : "typing"; } catch (e) {}
const typeBox = document.getElementById("typebox"), keysBtn = document.getElementById("keysbtn");
const SENT = "\u200b";   // an invisible first character, so a phone's backspace in an "empty" box still arrives
let prevTyped = SENT;
function showKeys() {
  keysBtn.textContent = "Keys: " + keyMode;
  keysBtn.title = keyMode === "shortcuts"
    ? "Space play/stop · Enter play start · R rec · O overdub · Z undo · Shift+Z redo · M menu · B browse · H main · X mix · U mute"
    : keyMode === "typing" ? "Your typing goes to the MPC (names of tracks, programs, projects)" : "Keyboard ignored";
  typeBox.hidden = keyMode !== "typing";
  typeBox.value = "";
  prevTyped = SENT;
}
keysBtn.onclick = () => {
  keyMode = MODES[(MODES.indexOf(keyMode) + 1) % MODES.length];
  try { localStorage.keyMode = keyMode; } catch (e) {}
  showKeys();
  if (keyMode === "typing") typeBox.focus();
};
showKeys();

// the box: whatever changed since last time becomes backspaces and typing (works with phone keyboards' word
// suggestions too, which replace whole words rather than sending single keys)
typeBox.addEventListener("input", () => {
  const v = typeBox.value;
  let p = 0;
  while (p < v.length && p < prevTyped.length && v[p] === prevTyped[p]) p++;
  for (let i = p; i < prevTyped.length; i++) tap(SPECIAL.Backspace);
  typeText(v.slice(p).replaceAll(SENT, ""));
  if (!v.startsWith(SENT) || v.length > 40) typeBox.value = SENT + (v.length > 40 ? "" : v.replaceAll(SENT, ""));
  prevTyped = typeBox.value;
  typeBox.setSelectionRange(typeBox.value.length, typeBox.value.length);
});
typeBox.addEventListener("focus", () => { typeBox.value = prevTyped = SENT; });
typeBox.addEventListener("blur", () => { typeBox.value = ""; prevTyped = SENT; });   // shows the hint again
typeBox.addEventListener("keydown", (e) => {   // keys that don't type: straight to the MPC
  if (e.isComposing || !(e.key in SPECIAL) || e.key === "Backspace") return;
  e.preventDefault(); e.stopPropagation();
  tap(SPECIAL[e.key]);
  if (e.key === "Enter") typeBox.value = prevTyped = SENT;   // a name is done: start fresh
});

document.addEventListener("keydown", (e) => {
  if (e.target === typeBox || e.ctrlKey && e.key !== "z" && e.key !== "Z" && e.key !== "y" || e.metaKey || e.altKey) return;
  if (keyMode === "typing") {
    if (e.ctrlKey) return;
    if (e.key in SPECIAL) tap(SPECIAL[e.key]);
    else if (e.key.length === 1 && KEYS[e.key]) tap(KEYS[e.key][0], KEYS[e.key][1]);
    else return;
    e.preventDefault();
  } else if (keyMode === "shortcuts") {
    let name = SHORTCUTS[e.key];
    if (e.ctrlKey) name = e.key === "y" || e.shiftKey ? "shift+undo" : "undo";   // Ctrl+Z, Ctrl+Shift+Z, Ctrl+Y
    if (e.key === " ") { name = playing ? "stop" : "play"; }
    if (!name) return;
    e.preventDefault();
    if (e.repeat) return;
    if (name === "play" || name === "playstart") playing = true;
    if (name === "stop") playing = false;
    pressBtn(name, true);
    const up = (u) => { if (u.code === e.code) { pressBtn(name, false); document.removeEventListener("keyup", up); } };
    document.addEventListener("keyup", up);
  }
});

document.getElementById("calbtn").onclick = () => send("cal");
document.getElementById("calcancel").onclick = () => { send("calcancel"); calEl.classList.remove("on"); };
connect();
</script>
</body>
</html>
