# TONE3000 browser page (Force Shadow layout syntax, built by tools/build_pages.sh). Keys must match params.json
# (build.sh skin: the plugin's own table). No apostrophes in comments (shlex). Presented as TONE3000 (their API
# terms): Powered by TONE3000, the creator with each tone.
# HeadRush style (Nov 2026, the user's ask, after a video of its TONE3000 library): one full screen, four views
# switched by the plugin (view: Library / Tone / Search / Account, when= on each part). Library = a top bar (credit,
# title, search and account icons), a grid of 3 x 2 tone cards (gear picture + name bar; a tap opens the tone),
# scroll arrows, and the source bar at the bottom (lit yellow). Tone = back, the picture, name, creator, models and a
# big DOWNLOAD bar. Pictures and icons are ours (make_art.py). A card picture shows only while its kind is set
# (option 0 draws nothing): the plugin clears them outside their view.
art_css=headrush.css
theme_bg=070d14
theme_plate_hi=0b1a2b
theme_plate_lo=03070c
theme_panel=05090e
theme_line=1f3346
theme_ink=f2f4f7
theme_ink_dim=8fa3b5
theme_accent=f2f4f7
theme_accent_hi=4fd1e8
theme_lcd=0a1520
theme_seg_active=f2c94c
theme_seg_inactive=0a121b
theme_seg_active_tx=0a0a0a
theme_btn_text=03110f
theme_btn_bg=22b8a6
theme_tab_on=f2c94c
theme_tab_on_tx=0a0a0a
theme_knob_face=d8dee6
theme_knob_ring=0a1420
theme_knob_dot=4fd1e8
