# TONE3000 browser page (Force Shadow layout syntax, built by tools/build_pages.sh). Keys must match params.json
# (build.sh skin: the plugin's own table). No apostrophes in comments (shlex). Presented as TONE3000 (their API
# terms): Powered by TONE3000, the creator with each tone.
# List-first (Nov 2026, the user's ask, HeadRush-style): the tones fill the BROWSE tab as rows to tap (a "list" of
# row_1..row_12; the picked one is lit), the picked tone with its models and a big DOWNLOAD tile beside them; the
# search follows Source / Sort / Brand / Style by itself; Sort, Brand, Style on FILTER; sign-in on ACCOUNT.
# Big tap targets are one-tile lists (dl_1, acct_1, acct_2): the kit's buttons are only 39 px tall.
theme_bg=0d1b2a
theme_plate_hi=1c3049
theme_plate_lo=0a1522
theme_panel=0a1420
