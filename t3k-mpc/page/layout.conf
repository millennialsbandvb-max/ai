# TONE3000 browser page (Force Shadow layout syntax, built by tools/build_pages.sh). Keys must match params.json
# (build.sh skin: the plugin's own table). No apostrophes in comments (shlex). Presented as TONE3000 (their API
# terms): Powered by TONE3000, the creator with each tone.
# A copy of the HeadRush Prime editor's TONE3000 browser (the user's screenshots, Nov 2026): sidebar, search pill with
# a word list (no keyboard in a plugin), result count, Sort by list, filter icon, Favorites / Browse / My Tones tabs,
# 10 cards (picture, title, uploader, downloads / favorites / models), scroll arrows, bottom tabs with TONE3000 lit;
# a tap on a card opens the tone pop-up (header, picture, description, makes, tags, NAM A2 (n) rows each with its
# download button); the filter drawer (Gear boxes, Reset / Done); the account box. The plugin switches views
# (param view, when= on every part); the pictures are ours (make_art.py; y here = picture y + 86).
