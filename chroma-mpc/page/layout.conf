# Chr0ma Console touchscreen page (Force Shadow layout syntax, built by tools/build_pages.sh). Keys must match
# params.json (build.sh skin: the plugin's own table). A knob of radius r takes r+5 above its centre and r+72 below;
# a frame title needs 50 px. No apostrophes in comments (shlex). The Tweak knobs' names follow the effect (live).
# Pedal look (tools/pedal_look.css): a pale grey-white enclosure with coral accents.
theme_bg=2c2f33
theme_plate_hi=5b6066
theme_plate_lo=1f2225
theme_panel=1b1d20
theme_line=4a4f55
theme_ink=f4f1ec
theme_ink_dim=c9c4bc
theme_accent=ff7a5c
theme_accent_hi=ffab94
theme_lcd=101113
theme_seg_active=ff7a5c
theme_seg_inactive=1d1f22
theme_seg_active_tx=101113
theme_btn_text=f4f1ec
theme_tab_on=ff7a5c
theme_tab_on_tx=101113
theme_knob_face=d8d8d4
theme_knob_ring=1b1d20
theme_knob_dot=ff9a80
[tab CONSOLE]
frame x=20 y=96 w=1240 h=130 title="PROGRAM"
stepper cx=480 cy=172 w=880 h=56 label="" key=program
stepper cx=1110 cy=172 w=260 h=46 label="" key=midi_ch   # MIDI Ch (Program Change, CC 102-105 module on/off): Omni / 1..16
frame x=20 y=234 w=300 h=470 title="CHARACTER"
enum_v cx=110 cy=360 label="" key=char_type
toggle cx=250 cy=330 label="ON" key=char_on
knob cx=100 cy=530 r=36 label="AMOUNT" key=char_amt
knob cx=240 cy=530 r=36 label="TWEAK" key=char_tweak
frame x=330 y=234 w=300 h=470 title="MOVEMENT"
enum_v cx=420 cy=360 label="" key=move_type
toggle cx=560 cy=330 label="ON" key=move_on
knob cx=410 cy=530 r=36 label="AMOUNT" key=move_amt
knob cx=550 cy=530 r=36 label="TWEAK" key=move_tweak
frame x=640 y=234 w=300 h=470 title="DIFFUSION"
enum_v cx=730 cy=360 label="" key=diff_type
toggle cx=870 cy=330 label="ON" key=diff_on
knob cx=720 cy=530 r=36 label="AMOUNT" key=diff_amt
knob cx=860 cy=530 r=36 label="TWEAK" key=diff_tweak
frame x=950 y=234 w=300 h=470 title="TEXTURE"
enum_v cx=1040 cy=360 label="" key=text_type
toggle cx=1180 cy=330 label="ON" key=text_on
knob cx=1030 cy=530 r=36 label="AMOUNT" key=text_amt
knob cx=1170 cy=530 r=36 label="TWEAK" key=text_tweak
qlinks "CONSOLE" = char_amt,char_tweak,move_amt,move_tweak,diff_amt,diff_tweak,text_amt,text_tweak,char_type,move_type,diff_type,text_type,char_on,move_on,diff_on,text_on
[tab OUTPUT]
frame x=20 y=96 w=1240 h=608 title="OUTPUT"
knob cx=200 cy=330 r=56 label="TILT" key=tilt
knob cx=480 cy=330 r=56 label="SENSITIVITY" key=sens
knob cx=760 cy=330 r=56 label="MIX" key=mix
knob cx=1040 cy=330 r=56 label="LEVEL" key=level
qlinks "OUTPUT" = tilt,sens,mix,level
