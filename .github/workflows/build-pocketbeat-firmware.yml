name: Build PocketBeat firmware

on:
  push:
    paths: ['firmware/**', '.github/workflows/build-pocketbeat-firmware.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pocketbeat-firmware
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Cache ESP32 core and libraries
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
          key: arduino-esp32-3.1.1-libs-v1
      - name: Install ESP32 core and libraries
        run: |
          [ -f ~/.arduino15/arduino-cli.yaml ] || arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          # downloads sometimes time out (504); retry a few times before giving up
          for i in 1 2 3 4 5; do arduino-cli core install esp32:esp32@3.1.1 && break; echo "core install failed, retry $i"; sleep 30; done
          arduino-cli core list | grep -q "esp32:esp32"
          for i in 1 2 3; do arduino-cli lib install "M5Unified" "ESP Async WebServer" "Async TCP" "BLE-MIDI" "NimBLE-Arduino@1.4.3" "MIDI Library" && break; sleep 20; done
      - name: Compile
        run: |
          echo "#define FW_VERSION \"${GITHUB_SHA::7}\"" > firmware/pocketbeat_sticks3/version.h
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32s3:FlashSize=8M,PartitionScheme=default_8MB,PSRAM=enabled,USBMode=default,CDCOnBoot=cdc" \
            --build-property "compiler.cpp.extra_flags=-DBLEMIDI_ESP32_NIMBLE" \
            --output-dir build \
            firmware/pocketbeat_sticks3
          ls -la build
      - name: Compile lite (no samples/speaker, for M5Launcher)
        run: |
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32s3:FlashSize=8M,PartitionScheme=default_8MB,PSRAM=enabled,USBMode=default,CDCOnBoot=cdc" \
            --build-property "compiler.cpp.extra_flags=-DBLEMIDI_ESP32_NIMBLE -DPB_LITE" \
            --output-dir build_lite \
            firmware/pocketbeat_sticks3
          ls -la build_lite
      - name: Compile Footboard
        run: |
          echo "#define FW_VERSION \"${GITHUB_SHA::7}\"" > firmware/footboard_sticks3/version.h
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32s3:FlashSize=8M,PartitionScheme=default_8MB,PSRAM=enabled,USBMode=default,CDCOnBoot=cdc" \
            --build-property "compiler.cpp.extra_flags=-DBLEMIDI_ESP32_NIMBLE" \
            --output-dir build_fb \
            firmware/footboard_sticks3
          ls -la build_fb
      - name: Package
        run: |
          mkdir -p out
          cp build/pocketbeat_sticks3.ino.merged.bin out/pocketbeat_sticks3.bin
          cp build/pocketbeat_sticks3.ino.bin out/pocketbeat_sticks3.app.bin
          cp build_lite/pocketbeat_sticks3.ino.bin out/pocketbeat_sticks3_lite.app.bin
          cp build_fb/footboard_sticks3.ino.merged.bin out/footboard_sticks3.bin
          cp build_fb/footboard_sticks3.ino.bin out/footboard_sticks3.app.bin
          cp firmware/README.md out/
      - uses: actions/upload-artifact@v4
        with:
          name: pocketbeat_sticks3-firmware
          path: out
      - name: Commit built firmware to firmware/bin
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git fetch origin main
          git reset --hard origin/main
          mkdir -p firmware/bin
          cp out/pocketbeat_sticks3.bin firmware/bin/pocketbeat_sticks3.bin
          cp out/pocketbeat_sticks3.app.bin firmware/bin/pocketbeat_sticks3.app.bin
          cp out/pocketbeat_sticks3_lite.app.bin firmware/bin/pocketbeat_sticks3_lite.app.bin
          cp out/footboard_sticks3.bin firmware/bin/footboard_sticks3.bin
          cp out/footboard_sticks3.app.bin firmware/bin/footboard_sticks3.app.bin
          echo "${GITHUB_SHA::7}" > firmware/bin/version.txt
          echo "${GITHUB_SHA::7}" > firmware/bin/footboard_version.txt
          git add firmware/bin/
          git diff --cached --quiet || git commit -m "Built firmware $(git rev-parse --short HEAD)"
          git push origin HEAD:main
