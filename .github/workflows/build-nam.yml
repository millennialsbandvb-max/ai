name: Build NAM MPC
on:
  workflow_dispatch:
  push:
    paths: [ 'nam-mpc/**', '*.zip', '.github/workflows/build-nam.yml' ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm
      - name: Unpack sources
        run: nam-mpc/build.sh deps
      - name: Offline test (x86, AddressSanitizer)
        run: nam-mpc/build.sh host
      - name: Build for MPC (armv7, glibc 2.36) and test it under emulation
        run: |
          docker run --rm --platform linux/arm/v7 -u "$(id -u):$(id -g)" -v "$PWD":/w -w /w arm32v7/gcc:12 bash -euc '
            CXX=g++ STRIP=strip READELF=readelf nam-mpc/build.sh arm
            NAM_MPC_DIR=nam-mpc/build/fixture nam-mpc/build/nam-test nam-mpc/build/NAM-MPC.so
          '
      - name: Skin and release zip
        run: |
          pip install -q pillow
          nam-mpc/build.sh skin
          nam-mpc/build.sh package
      - uses: actions/upload-artifact@v4
        with:
          name: NAM-MPC-mpc-armv7
          path: |
            nam-mpc/build/NAM-MPC-*-mpc-armv7.zip
            nam-mpc/build/preview_*.png
