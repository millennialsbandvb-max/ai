name: Build MPC amsynth VST2
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm
      - name: Build amsynth 1.13.4 ARMv7 VST2
        run: |
          git clone --depth 1 --branch release-1.13.4 https://github.com/amsynth/amsynth.git amsynth
          docker run --rm --platform linux/arm/v7 -v "$PWD":/w -w /w/amsynth arm32v7/debian:bookworm bash -euc '
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential autoconf automake libtool gettext intltool pkg-config curl ca-certificates git
            ./autogen.sh
            ./configure --without-gui --without-alsa --without-jack --without-dssi
            make -j2
            find . -type f \( -name "*.so" -o -name "*vst*" \) -print
            VST="$(find . -type f -name "*.so" | grep -i vst | head -1)"
            test -n "$VST"
            cp "$VST" /w/amsynth.so
            file /w/amsynth.so
            readelf -h /w/amsynth.so
          '
      - name: Package
        run: |
          mkdir -p package/vst
          cp amsynth.so package/vst/amsynth.so
          printf '%s\n' 'MPC Gen1 ARM VST2 diagnostic build of amsynth 1.13.4' > package/README.txt
          zip -r MPC-amsynth-VST2-armhf.zip package
      - uses: actions/upload-artifact@v4
        with:
          name: MPC-amsynth-VST2-armhf
          path: MPC-amsynth-VST2-armhf.zip
